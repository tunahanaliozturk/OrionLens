<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="600" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionLens - where the correlation context lives</text>
  <text class="subtitle" x="40" y="78">One package (OrionLens). The context is set at the inbound edge, read anywhere in the async flow, and written on every outbound call.</text>

  <!-- column headers -->
  <text class="small" x="125" y="118" text-anchor="middle">INBOUND</text>
  <text class="small" x="580" y="118" text-anchor="middle">AMBIENT</text>
  <text class="small" x="1040" y="118" text-anchor="middle">OUTBOUND</text>

  <!-- row 1: HTTP -->
  <rect class="ext" x="40" y="135" width="170" height="90" rx="14"/>
  <text class="label" x="125" y="170" text-anchor="middle">HTTP request</text>
  <text class="small" x="125" y="194" text-anchor="middle">X-Correlation-ID,</text>
  <text class="small" x="125" y="212" text-anchor="middle">X-Orion-Baggage</text>

  <path class="flow" d="M210,180 L238,180"/>

  <rect class="step" x="240" y="135" width="210" height="90" rx="14"/>
  <text class="label" x="345" y="166" text-anchor="middle">CorrelationMiddleware</text>
  <text class="code" x="345" y="190" text-anchor="middle">app.UseOrionLens()</text>
  <text class="small" x="345" y="212" text-anchor="middle">Extract, BeginScope, echo id</text>

  <path class="flow" d="M450,180 L478,180"/>

  <!-- row 2: message / job -->
  <rect class="ext" x="40" y="275" width="170" height="90" rx="14"/>
  <text class="label" x="125" y="310" text-anchor="middle">Message or job</text>
  <text class="small" x="125" y="334" text-anchor="middle">any header carrier</text>

  <path class="flow" d="M210,320 L238,320"/>

  <rect class="step" x="240" y="275" width="210" height="90" rx="14"/>
  <text class="code" x="345" y="306" text-anchor="middle">CorrelationPropagator</text>
  <text class="code" x="345" y="328" text-anchor="middle">.Extract(getHeader, o)</text>
  <text class="small" x="345" y="350" text-anchor="middle">then OrionContext.BeginScope</text>

  <path class="flow" d="M450,320 L478,320"/>

  <!-- ambient store -->
  <rect class="step" x="480" y="135" width="200" height="230" rx="14"/>
  <text class="label" x="580" y="166" text-anchor="middle">OrionContext</text>
  <text class="small" x="580" y="188" text-anchor="middle">AsyncLocal ambient store,</text>
  <text class="small" x="580" y="206" text-anchor="middle">flows across await</text>
  <text class="code" x="580" y="240" text-anchor="middle">.Current</text>
  <text class="small" x="580" y="262" text-anchor="middle">CorrelationContext:</text>
  <text class="code" x="580" y="284" text-anchor="middle">CorrelationId</text>
  <text class="code" x="580" y="304" text-anchor="middle">Baggage, IsSampled</text>
  <text class="small" x="580" y="340" text-anchor="middle">scopes nest and restore</text>

  <path class="flow" d="M680,180 L708,180"/>
  <path class="flow" d="M680,320 L708,320"/>

  <!-- outbound row 1 -->
  <rect class="step" x="710" y="135" width="240" height="90" rx="14"/>
  <text class="code" x="830" y="166" text-anchor="middle">CorrelationPropagation</text>
  <text class="code" x="830" y="186" text-anchor="middle">Handler</text>
  <text class="small" x="830" y="210" text-anchor="middle">HttpClient DelegatingHandler</text>

  <path class="flow" d="M950,180 L978,180"/>

  <rect class="ext" x="980" y="135" width="180" height="90" rx="14"/>
  <text class="label" x="1070" y="170" text-anchor="middle">Downstream</text>
  <text class="label" x="1070" y="190" text-anchor="middle">service</text>
  <text class="small" x="1070" y="212" text-anchor="middle">same id and baggage</text>

  <!-- outbound row 2 -->
  <rect class="step" x="710" y="275" width="240" height="90" rx="14"/>
  <text class="code" x="830" y="302" text-anchor="middle">CorrelationPropagator</text>
  <text class="code" x="830" y="322" text-anchor="middle">.Inject(context, setHeader)</text>
  <text class="small" x="830" y="350" text-anchor="middle">onto an outgoing envelope</text>

  <path class="flow" d="M950,320 L978,320"/>

  <rect class="ext" x="980" y="275" width="180" height="90" rx="14"/>
  <text class="label" x="1070" y="310" text-anchor="middle">Broker or queue</text>
  <text class="small" x="1070" y="334" text-anchor="middle">your transport</text>

  <!-- your code -->
  <path class="flow back" d="M580,408 L580,367"/>
  <text class="edge" x="592" y="394">reads</text>
  <rect class="step" x="425" y="410" width="310" height="80" rx="14"/>
  <text class="label" x="580" y="438" text-anchor="middle">Your code</text>
  <text class="code" x="580" y="460" text-anchor="middle">OrionContext.Current?.CorrelationId</text>
  <text class="code" x="580" y="478" text-anchor="middle">logger.BeginCorrelationScope()</text>

  <!-- notes -->
  <rect class="note" x="40" y="410" width="370" height="160" rx="10"/>
  <text class="label" x="60" y="438">Registration</text>
  <text class="code" x="60" y="464" style="font-variant-ligatures: none">services.AddOrionLens(o =&gt; ...)</text>
  <text class="small" x="60" y="488">validates CorrelationOptions, then registers it</text>
  <text class="small" x="60" y="506">as a singleton and CorrelationPropagationHandler</text>
  <text class="small" x="60" y="524">as transient (TryAdd). Attach the handler with</text>
  <text class="code" x="60" y="548">.AddHttpMessageHandler&lt;...&gt;()</text>

  <rect class="note" x="750" y="410" width="410" height="160" rx="10"/>
  <text class="label" x="770" y="438">Opt-in headers (CorrelationOptions)</text>
  <text class="small" x="770" y="464">UseTraceContext: also read and write traceparent.</text>
  <text class="small" x="770" y="486">UseW3CBaggage: also read and write baggage.</text>
  <text class="small" x="770" y="508">AlignWithActivity: seed the id from Activity.Current;</text>
  <text class="small" x="770" y="526">the middleware tags the Activity with the id.</text>
  <text class="small" x="770" y="550">All off by default.</text>
</svg>
