<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="774" viewBox="0 0 1200 774">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="1200" height="774" fill="#ffffff"/>
  <text class="title" x="40" y="52">OrionLens - CorrelationPropagator.Extract</text>
  <text class="subtitle" x="40" y="78">Where the correlation id comes from when a request or message arrives, checked top to bottom; the first match wins.</text>
  <rect class="step" x="50" y="105" width="300" height="56" rx="14"/>
  <text class="code" x="200" y="138" text-anchor="middle">Extract(getHeader, options)</text>
  <path class="flow" d="M200,161 L200,193"/>
  <polygon class="decision" points="200,195 350,240 200,285 50,240"/>
  <text class="code" x="200" y="236" text-anchor="middle">CorrelationHeader</text>
  <text class="small" x="200" y="254" text-anchor="middle">has a value?</text>
  <path class="flow" d="M350,240 L418,240"/>
  <text class="edge" x="384" y="232" text-anchor="middle">yes</text>
  <rect class="ok" x="420" y="208" width="300" height="64" rx="14"/>
  <text class="label" x="570" y="234" text-anchor="middle">Use the header value</text>
  <text class="small" x="570" y="256" text-anchor="middle">as-is, no format check</text>
  <path d="M720,240 L760,240" fill="none" stroke="#64748b" stroke-width="2"/>
  <path class="flow" d="M200,285 L200,313"/>
  <text class="edge" x="210" y="305">no</text>
  <polygon class="decision" points="200,315 350,360 200,405 50,360"/>
  <text class="small" x="200" y="356" text-anchor="middle">AlignWithActivity and a</text>
  <text class="small" x="200" y="374" text-anchor="middle">W3C Activity is current?</text>
  <path class="flow" d="M350,360 L418,360"/>
  <text class="edge" x="384" y="352" text-anchor="middle">yes</text>
  <rect class="ok" x="420" y="328" width="300" height="64" rx="14"/>
  <text class="label" x="570" y="354" text-anchor="middle">Activity trace-id</text>
  <text class="small" x="570" y="376" text-anchor="middle">32 hex, not all zeros</text>
  <path d="M720,360 L760,360" fill="none" stroke="#64748b" stroke-width="2"/>
  <path class="flow" d="M200,405 L200,433"/>
  <text class="edge" x="210" y="425">no</text>
  <polygon class="decision" points="200,435 350,480 200,525 50,480"/>
  <text class="small" x="200" y="476" text-anchor="middle">UseTraceContext and a valid</text>
  <text class="small" x="200" y="494" text-anchor="middle">traceparent trace-id?</text>
  <path class="flow" d="M350,480 L418,480"/>
  <text class="edge" x="384" y="472" text-anchor="middle">yes</text>
  <rect class="ok" x="420" y="448" width="300" height="64" rx="14"/>
  <text class="label" x="570" y="474" text-anchor="middle">traceparent trace-id</text>
  <text class="small" x="570" y="496" text-anchor="middle">32 lowercase hex, not all zeros</text>
  <path d="M720,480 L760,480" fill="none" stroke="#64748b" stroke-width="2"/>
  <path class="flow" d="M200,525 L200,553"/>
  <text class="edge" x="210" y="545">no</text>
  <polygon class="decision" points="200,555 350,600 200,645 50,600"/>
  <text class="code" x="200" y="596" text-anchor="middle">GenerateIdWhenMissing</text>
  <text class="small" x="200" y="614" text-anchor="middle">(default true)?</text>
  <path class="flow" d="M350,600 L418,600"/>
  <text class="edge" x="384" y="592" text-anchor="middle">yes</text>
  <rect class="ok" x="420" y="568" width="300" height="64" rx="14"/>
  <text class="label" x="570" y="594" text-anchor="middle">New id</text>
  <text class="code" x="570" y="616" text-anchor="middle">Guid.NewGuid().ToString("N")</text>
  <path d="M720,600 L760,600" fill="none" stroke="#64748b" stroke-width="2"/>
  <path class="flow" d="M200,645 L200,678"/>
  <text class="edge" x="210" y="665">no</text>
  <rect class="step" x="50" y="680" width="300" height="64" rx="14"/>
  <text class="code" x="200" y="706" text-anchor="middle">MissingIdSentinel</text>
  <text class="small" x="200" y="728" text-anchor="middle">taken verbatim; empty string by default</text>
  <path d="M350,712 L760,712 L760,240" fill="none" stroke="#64748b" stroke-width="2"/>
  <path class="flow" d="M760,240 L798,240"/>

  <rect class="step" x="800" y="190" width="360" height="100" rx="14"/>
  <text class="label" x="820" y="216">Sampling decision (IsSampled)</text>
  <text class="small" x="820" y="240">AlignWithActivity: Activity.Current Recorded flag,</text>
  <text class="small" x="820" y="258">else UseTraceContext: traceparent sampled flag,</text>
  <text class="small" x="820" y="276">else it stays true.</text>
  <path class="flow" d="M980,290 L980,318"/>

  <rect class="step" x="800" y="320" width="360" height="118" rx="14"/>
  <text class="label" x="820" y="346">Baggage</text>
  <text class="small" x="820" y="370">BaggageHeader (X-Orion-Baggage), then the W3C</text>
  <text class="small" x="820" y="388">baggage header when UseW3CBaggage (custom wins</text>
  <text class="small" x="820" y="406">on a key clash). Malformed pairs are skipped;</text>
  <text class="small" x="820" y="424">MaxBaggageCount / MaxBaggageBytes stop parsing.</text>
  <path class="flow" d="M980,438 L980,466"/>

  <rect class="ok" x="800" y="468" width="360" height="64" rx="14"/>
  <text class="label" x="980" y="495" text-anchor="middle">CorrelationContext</text>
  <text class="small" x="980" y="517" text-anchor="middle">caller makes it current with OrionContext.BeginScope</text>

  <rect class="note" x="800" y="570" width="360" height="174" rx="10"/>
  <text class="label" x="820" y="598">Notes</text>
  <text class="small" x="820" y="622">An inbound CorrelationHeader value always wins</text>
  <text class="small" x="820" y="640">in Extract. Under the middleware with</text>
  <text class="small" x="820" y="658">UseTraceContext, BeginTraceLinkedScope can then</text>
  <text class="small" x="820" y="676">replace it with a current Activity's trace-id.</text>
  <text class="small" x="820" y="702">NonPropagatingBaggageKeys are still accepted</text>
  <text class="small" x="820" y="720">here; they are only dropped by Inject.</text>
</svg>
