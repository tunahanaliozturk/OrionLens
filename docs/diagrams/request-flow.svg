<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="905" viewBox="0 0 1200 905">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="1200" height="905" fill="#ffffff"/>
  <text class="title" x="40" y="52">OrionLens - one request through the middleware and out again</text>
  <text class="subtitle" x="40" y="78">app.UseOrionLens() sets the ambient context for the request; CorrelationPropagationHandler copies it onto every outbound HttpClient call.</text>
  <line class="lane" x1="135" y1="176" x2="135" y2="790"/>
  <rect class="ext" x="49" y="112" width="172" height="64" rx="12"/>
  <text class="label" x="135" y="149" text-anchor="middle">HTTP caller</text>
  <line class="lane" x1="325" y1="176" x2="325" y2="790"/>
  <rect class="step" x="239" y="112" width="172" height="64" rx="12"/>
  <text class="label" x="325" y="139" text-anchor="middle">Correlation</text>
  <text class="label" x="325" y="159" text-anchor="middle">Middleware</text>
  <line class="lane" x1="515" y1="176" x2="515" y2="790"/>
  <rect class="step" x="429" y="112" width="172" height="64" rx="12"/>
  <text class="label" x="515" y="139" text-anchor="middle">OrionContext</text>
  <text class="label" x="515" y="159" text-anchor="middle">(AsyncLocal)</text>
  <line class="lane" x1="705" y1="176" x2="705" y2="790"/>
  <rect class="ext" x="619" y="112" width="172" height="64" rx="12"/>
  <text class="label" x="705" y="149" text-anchor="middle">Your endpoint</text>
  <line class="lane" x1="895" y1="176" x2="895" y2="790"/>
  <rect class="step" x="809" y="112" width="172" height="64" rx="12"/>
  <text class="label" x="895" y="139" text-anchor="middle">Correlation</text>
  <text class="label" x="895" y="159" text-anchor="middle">PropagationHandler</text>
  <line class="lane" x1="1085" y1="176" x2="1085" y2="790"/>
  <rect class="ext" x="999" y="112" width="172" height="64" rx="12"/>
  <text class="label" x="1085" y="139" text-anchor="middle">Downstream</text>
  <text class="label" x="1085" y="159" text-anchor="middle">service</text>
  <path class="flow" d="M135,240 L323,240"/>
  <text class="edge" x="230" y="232" text-anchor="middle">X-Correlation-ID: abc</text>
  <text class="edge" x="230" y="214" text-anchor="middle">HTTP request</text>
  <circle class="badge" cx="24" cy="240" r="12"/>
  <text class="badge-text" x="24" y="244" text-anchor="middle">1</text>
  <path class="flow" d="M325,310 L513,310"/>
  <text class="edge" x="420" y="302" text-anchor="middle">then BeginScope(context)</text>
  <text class="code" x="420" y="284" text-anchor="middle">Extract(getHeader, o)</text>
  <circle class="badge" cx="24" cy="310" r="12"/>
  <text class="badge-text" x="24" y="314" text-anchor="middle">2</text>
  <path class="flow back" d="M325,380 L137,380"/>
  <text class="edge" x="230" y="372" text-anchor="middle">X-Correlation-ID: abc</text>
  <text class="edge" x="230" y="354" text-anchor="middle">response header set</text>
  <circle class="badge" cx="24" cy="380" r="12"/>
  <text class="badge-text" x="24" y="384" text-anchor="middle">3</text>
  <path class="flow" d="M325,450 L703,450"/>
  <text class="code" x="610" y="442" text-anchor="middle">next(context)</text>
  <circle class="badge" cx="24" cy="450" r="12"/>
  <text class="badge-text" x="24" y="454" text-anchor="middle">4</text>
  <path class="flow" d="M705,510 L517,510"/>
  <text class="code" x="610" y="502" text-anchor="middle">OrionContext.Current</text>
  <circle class="badge" cx="24" cy="510" r="12"/>
  <text class="badge-text" x="24" y="514" text-anchor="middle">5</text>
  <path class="flow" d="M705,570 L893,570"/>
  <text class="code" x="800" y="562" text-anchor="middle">httpClient.SendAsync</text>
  <circle class="badge" cx="24" cy="570" r="12"/>
  <text class="badge-text" x="24" y="574" text-anchor="middle">6</text>
  <path class="flow" d="M895,630 L517,630"/>
  <text class="code" x="610" y="622" text-anchor="middle">OrionContext.Current</text>
  <circle class="badge" cx="24" cy="630" r="12"/>
  <text class="badge-text" x="24" y="634" text-anchor="middle">7</text>
  <path class="flow" d="M895,700 L1083,700"/>
  <text class="edge" x="990" y="692" text-anchor="middle">X-Orion-Baggage</text>
  <text class="edge" x="990" y="674" text-anchor="middle">Inject: X-Correlation-ID,</text>
  <circle class="badge" cx="24" cy="700" r="12"/>
  <text class="badge-text" x="24" y="704" text-anchor="middle">8</text>
  <path class="flow back" d="M325,770 L513,770"/>
  <text class="edge" x="420" y="762" text-anchor="middle">context restored</text>
  <text class="edge" x="420" y="744" text-anchor="middle">scope disposed: previous</text>
  <circle class="badge" cx="24" cy="770" r="12"/>
  <text class="badge-text" x="24" y="774" text-anchor="middle">9</text>
  <rect class="note" x="40" y="812" width="1120" height="70" rx="10"/>
  <text class="small" x="60" y="840">Step 3 runs only when WriteResponseHeader is true (default). With UseTraceContext the scope in step 2 is OrionTraceContextScope.BeginTraceLinkedScope:</text>
  <text class="small" x="60" y="862">a current W3C Activity's trace-id then becomes the id that is echoed and propagated. With AlignWithActivity the id is also set as tag orion.correlation_id on it.</text>
</svg>
